<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CymaticaMandala</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050810">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CymaticaMandala">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Raleway:wght@300;400;500&display=swap');
:root{
  --gold:#c9a84c;--gl:#f0d080;--deep:#050810;
  --border:rgba(201,168,76,0.3);--blue:#00aaff;
  --lp:88px;--rp:88px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--deep);color:#fff;font-family:'Raleway',sans-serif;
  height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none}

.app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;overflow:hidden}

/* TOP BAR */
.top-bar{display:flex;align-items:center;justify-content:space-between;
  padding:6px 10px 5px;border-bottom:1px solid var(--border);
  background:rgba(5,8,16,.98);flex-shrink:0}
.app-title{font-family:'Cinzel',serif;font-size:1.05rem;font-weight:900;
  background:linear-gradient(135deg,var(--gold),var(--gl),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:.06em;white-space:nowrap}
.top-stats{display:flex;gap:10px;align-items:center}
.stat-chip{display:flex;flex-direction:column;align-items:center;min-width:44px}
.stat-val{font-size:.8rem;font-weight:600;color:var(--gl);line-height:1}
.stat-val.blue{color:var(--blue)}
.stat-lbl{font-size:.48rem;color:rgba(255,255,255,.3);letter-spacing:.12em;text-transform:uppercase;margin-top:1px}
.purity-bar{width:44px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:3px}
.purity-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gl));border-radius:2px;transition:width .3s}

/* MODE TOGGLE */
.mode-toggle{display:flex;gap:0;margin:4px 6px;border-radius:8px;overflow:hidden;
  border:1px solid var(--border);flex-shrink:0}
.mode-btn{flex:1;padding:5px 4px;background:rgba(255,255,255,.03);border:none;
  color:rgba(255,255,255,.4);font-family:'Raleway',sans-serif;font-size:.6rem;
  font-weight:600;letter-spacing:.05em;cursor:pointer;text-transform:uppercase;
  transition:all .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.mode-btn.active{background:rgba(201,168,76,.15);color:var(--gl)}
.mode-btn:first-child{border-right:1px solid var(--border)}

/* WAVEFORM */
.waveform-bar{height:22px;margin:0 6px 3px;background:rgba(0,0,0,.4);
  border-radius:4px;border:1px solid var(--border);overflow:hidden;flex-shrink:0}
#waveformCanvas{width:100%;height:100%;display:block}

/* MAIN 3-COL */
.main-layout{display:flex;flex:1;overflow:hidden;min-height:0}

/* LEFT PANE */
.left-pane{width:var(--lp);flex-shrink:0;display:flex;flex-direction:column;
  align-items:center;padding:8px 4px;gap:6px;
  border-right:1px solid var(--border);background:rgba(201,168,76,.02);overflow:hidden}
.mic-btn{width:54px;height:54px;border-radius:50%;border:2px solid var(--gold);
  background:radial-gradient(circle,rgba(201,168,76,.14) 0%,rgba(201,168,76,.02) 70%);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  position:relative;-webkit-tap-highlight-color:transparent;transition:all .2s;flex-shrink:0}
.mic-btn.active{border-color:#ff4444;
  background:radial-gradient(circle,rgba(255,68,68,.2) 0%,rgba(255,68,68,.04) 70%);
  animation:pulse-mic 1.4s ease-in-out infinite}
@keyframes pulse-mic{0%,100%{box-shadow:0 0 14px rgba(255,68,68,.3)}50%{box-shadow:0 0 28px rgba(255,68,68,.6)}}
.mic-ring{position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(201,168,76,.2);
  animation:ring-out 2s ease-out infinite;opacity:0}
.mic-btn.active .mic-ring{border-color:rgba(255,68,68,.3);animation:ring-out 1.2s ease-out infinite}
@keyframes ring-out{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.45);opacity:0}}
.mic-icon{font-size:22px}
.mic-hint{font-size:.5rem;color:rgba(255,255,255,.3);text-align:center;line-height:1.3}
.corr-block{width:100%;padding:4px 2px;display:flex;flex-direction:column;gap:3px;align-items:center}
.corr-label-s{font-size:.48rem;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.35)}
.corr-score-s{font-size:.9rem;font-weight:600;color:var(--gl)}
.match-name-s{font-size:.5rem;color:rgba(201,168,76,.75);text-align:center;line-height:1.3}
.corr-bar-s{width:100%;height:4px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.corr-fill-s{height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--gold));border-radius:3px;transition:width .5s}
.mantra-block{display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 0}
.mantra-sym{font-family:'Cinzel',serif;font-size:1.15rem;color:var(--gl);line-height:1}
.mantra-lbl{font-size:.45rem;color:rgba(255,255,255,.3);text-align:center;line-height:1.3}

/* CENTER */
.center-pane{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.canvas-section{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.canvas-section:first-child{border-bottom:1px solid var(--border)}
.panel-label{font-size:.48rem;text-transform:uppercase;letter-spacing:.2em;
  text-align:center;padding:2px 0;flex-shrink:0}
.sand-label{color:#ff9944;background:rgba(255,153,68,.07);border-bottom:1px solid rgba(255,153,68,.15)}
.laser-label{color:var(--blue);background:rgba(0,170,255,.07);border-bottom:1px solid rgba(0,170,255,.15)}
.canvas-section canvas{width:100%!important;flex:1;display:block;min-height:0}

/* RIGHT PANE */
.right-pane{width:var(--rp);flex-shrink:0;display:flex;flex-direction:column;
  align-items:center;padding:8px 4px;gap:5px;
  border-left:1px solid var(--border);background:rgba(0,170,255,.015)}
.btn{width:76px;padding:10px 4px;border-radius:10px;border:1px solid;
  font-family:'Raleway',sans-serif;font-size:.58rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.07em;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  -webkit-tap-highlight-color:transparent;transition:opacity .15s;flex-shrink:0}
.btn:active{opacity:.6}
.btn-icon{font-size:16px}
.btn-save{background:rgba(201,168,76,.08);border-color:rgba(201,168,76,.35);color:var(--gl)}
.btn-view{background:rgba(0,170,255,.07);border-color:rgba(0,170,255,.28);color:var(--blue)}
.btn-pdf {background:rgba(80,200,80,.07);border-color:rgba(80,200,80,.28);color:#88dd88}
.btn-new {background:rgba(255,90,90,.07);border-color:rgba(255,90,90,.28);color:#ff9999}
.btn-placeholder{width:76px;height:38px;border-radius:10px;
  border:1px dashed rgba(255,255,255,.08);background:transparent;display:flex;
  align-items:center;justify-content:center;font-size:.44rem;color:rgba(255,255,255,.15)}

/* CHAKRA OVERLAY */
.chakra-overlay{display:none;position:absolute;inset:0;z-index:10;
  background:rgba(5,8,16,.94);padding:6px;overflow-y:auto}
.chakra-overlay.visible{display:block}
.chakra-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:6px}
.cBtn{padding:7px 3px;border-radius:7px;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);color:rgba(255,255,255,.7);cursor:pointer;
  font-family:'Raleway',sans-serif;font-size:.62rem;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:all .2s}
.cBtn span{font-size:.5rem;opacity:.55;font-weight:400}
.cBtn.playing{transform:scale(1.06);box-shadow:0 0 14px var(--cborder,rgba(255,255,255,.3))}
.cBtn:active{opacity:.7}
.tone-row{display:flex;align-items:center;gap:8px;padding:3px 2px 4px}
.tone-row label{font-size:.6rem;color:rgba(255,255,255,.4);min-width:48px}
.tone-row input[type=range]{flex:1;accent-color:var(--gold)}
.tone-stop{flex-shrink:0;padding:5px 10px;border-radius:7px;
  border:1px solid rgba(255,90,90,.35);background:rgba(255,90,90,.07);
  color:#ff9999;font-size:.62rem;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tone-stop:active{opacity:.6}

/* MODALS */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;
  padding:20px;overflow-y:auto;align-items:flex-start;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:rgba(10,14,30,.97);border:1px solid var(--border);border-radius:16px;
  padding:20px;width:100%;max-width:440px;margin-top:20px}
.modal-title{font-family:'Cinzel',serif;font-size:1rem;color:var(--gl);margin-bottom:16px;
  display:flex;justify-content:space-between;align-items:center}
.close-btn{background:none;border:none;color:rgba(255,255,255,.4);font-size:1.2rem;cursor:pointer;padding:4px 8px}
.form-label{font-size:.68rem;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}
.form-input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(201,168,76,.3);
  border-radius:8px;padding:10px 12px;color:#fff;font-family:'Raleway',sans-serif;
  font-size:.85rem;outline:none;margin-bottom:12px}
.form-input:focus{border-color:var(--gold)}
.btn-confirm{width:100%;background:linear-gradient(135deg,rgba(201,168,76,.25),rgba(201,168,76,.1));
  border:1px solid var(--gold);border-radius:8px;padding:12px;color:var(--gl);
  font-family:'Cinzel',serif;font-size:.85rem;letter-spacing:.1em;cursor:pointer}
.sessions-list{display:flex;flex-direction:column;gap:10px;max-height:65vh;overflow-y:auto}
.session-card{background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.18);border-radius:10px;padding:12px}
.session-top{display:flex;justify-content:space-between;margin-bottom:5px}
.session-mantra{font-family:'Cinzel',serif;font-size:.95rem;color:var(--gl)}
.session-date{font-size:.58rem;color:rgba(255,255,255,.3)}
.session-meta{font-size:.62rem;color:rgba(255,255,255,.45);display:flex;gap:10px}
.session-meta span{color:var(--blue)}
.session-thumbs{display:flex;gap:6px;margin-top:8px}
.session-thumbs img{flex:1;border-radius:6px;border:1px solid rgba(255,255,255,.1);max-height:90px;object-fit:cover;width:0}
.no-sessions{text-align:center;padding:40px 20px;color:rgba(255,255,255,.28);font-size:.85rem;line-height:2}

/* TOAST + SHAKE FLASH */
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%) translateY(14px);
  background:rgba(8,12,28,.96);border:1px solid var(--gold);border-radius:20px;
  padding:8px 20px;font-size:.75rem;color:var(--gl);opacity:0;transition:all .28s;
  z-index:200;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes shake-flash{0%{background:rgba(201,168,76,0)}35%{background:rgba(201,168,76,.18)}100%{background:rgba(201,168,76,0)}}
.shake-flash{animation:shake-flash .65s ease-out}
</style>
</head>
<body>
<div class="app">

  <div class="top-bar">
    <div class="app-title">CymaticaMandala</div>
    <div class="top-stats">
      <div class="stat-chip">
        <div class="stat-val blue" id="freqDisplay">— Hz</div>
        <div class="stat-lbl">Freq</div>
      </div>
      <div class="stat-chip">
        <div class="stat-val" id="purityScore">0%</div>
        <div class="stat-lbl">Purity</div>
        <div class="purity-bar"><div class="purity-fill" id="purityFill"></div></div>
      </div>
    </div>
  </div>

  <div class="mode-toggle">
    <button class="mode-btn active" id="modeMeasure">🎙️ Measure Mantra</button>
    <button class="mode-btn"        id="modeChakra" >🔊 Chakra Tones</button>
  </div>
  <div class="waveform-bar"><canvas id="waveformCanvas"></canvas></div>

  <div class="main-layout">

    <!-- LEFT: mic + match + mantra -->
    <div class="left-pane" id="leftPane">
      <div class="mic-btn" id="micBtn">
        <div class="mic-ring"></div>
        <span class="mic-icon" id="micIcon">🎙️</span>
      </div>
      <div class="mic-hint" id="micHint">Tap to<br>start</div>
      <div class="mantra-block">
        <div class="mantra-sym" id="mantraDisplay">—</div>
        <div class="mantra-lbl" id="mantraName">Waiting...</div>
      </div>
      <div class="corr-block">
        <div class="corr-label-s">Match</div>
        <div class="corr-score-s" id="corrScore">0%</div>
        <div class="match-name-s" id="matchName">—</div>
        <div class="corr-bar-s"><div class="corr-fill-s" id="corrFill"></div></div>
      </div>
    </div>

    <!-- CENTER: sand + laser canvases -->
    <div class="center-pane" id="centerPane">
      <div class="canvas-section">
        <div class="panel-label sand-label">Sand Cymatics</div>
        <canvas id="sandCanvas"></canvas>
        <!-- Chakra overlay sits on top of sand canvas -->
        <div class="chakra-overlay" id="chakraPanel">
          <div class="chakra-grid">
            <button class="cBtn" style="border-color:rgba(180,0,0,.4);--cborder:rgba(220,40,40,.6)"   data-freq="136" data-sym="OM"  data-name="Sri Yantra">OM<span>136 Hz</span></button>
            <button class="cBtn" style="border-color:rgba(180,40,0,.4);--cborder:rgba(220,80,0,.6)"   data-freq="256" data-sym="LAM" data-name="Muladhara">LAM<span>256 Hz</span></button>
            <button class="cBtn" style="border-color:rgba(180,120,0,.4);--cborder:rgba(220,160,0,.6)" data-freq="288" data-sym="VAM" data-name="Svadhisthana">VAM<span>288 Hz</span></button>
            <button class="cBtn" style="border-color:rgba(180,180,0,.4);--cborder:rgba(220,220,0,.6)" data-freq="528" data-sym="RAM" data-name="Manipura">RAM<span>528 Hz</span></button>
            <button class="cBtn" style="border-color:rgba(0,160,60,.4);--cborder:rgba(0,200,80,.6)"   data-freq="594" data-sym="YAM" data-name="Anahata">YAM<span>594 Hz</span></button>
            <button class="cBtn" style="border-color:rgba(0,120,220,.4);--cborder:rgba(0,170,255,.6)" data-freq="672" data-sym="HAM" data-name="Vishuddha">HAM<span>672 Hz</span></button>
            <button class="cBtn" style="border-color:rgba(80,0,200,.4);--cborder:rgba(120,60,255,.6)" data-freq="852" data-sym="OM"  data-name="Ajna">AUM<span>852 Hz</span></button>
            <button class="cBtn" style="border-color:rgba(160,0,200,.4);--cborder:rgba(200,60,255,.6)"data-freq="963" data-sym="AH"  data-name="Sahasrara">AH<span>963 Hz</span></button>
          </div>
          <div class="tone-row">
            <label>Volume</label>
            <input type="range" id="toneVol" min="0" max="100" value="28">
            <button class="tone-stop" id="toneStop">■ Stop</button>
          </div>
        </div>
      </div>
      <div class="canvas-section">
        <div class="panel-label laser-label">Laser Pattern</div>
        <canvas id="laserCanvas"></canvas>
      </div>
    </div>

    <!-- RIGHT: action buttons -->
    <div class="right-pane" id="rightPane">
      <button class="btn btn-save" id="btnSave"><span class="btn-icon">💾</span>Save</button>
      <button class="btn btn-view" id="btnView"><span class="btn-icon">📂</span>Saved</button>
      <button class="btn btn-pdf"  id="btnPdf" ><span class="btn-icon">📄</span>PDF</button>
      <button class="btn btn-new"  id="btnNew" ><span class="btn-icon">✨</span>New</button>
      <div class="btn-placeholder">+ soon</div>
      <div class="btn-placeholder">+ soon</div>
    </div>

  </div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="saveModal">
  <div class="modal">
    <div class="modal-title">Save Session<button class="close-btn" id="closeSave">✕</button></div>
    <div class="form-label">Session Name</div>
    <input class="form-input" id="sessionName" placeholder="e.g. Morning OM chant"/>
    <div class="form-label">Notes (optional)</div>
    <input class="form-input" id="sessionNotes" placeholder="How did you feel?"/>
    <button class="btn-confirm" id="confirmSave">✦ Save to Library</button>
  </div>
</div>
<div class="modal-overlay" id="sessionsModal">
  <div class="modal">
    <div class="modal-title">Saved Sessions<button class="close-btn" id="closeSessions">✕</button></div>
    <div class="sessions-list" id="sessionsList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
// ── State ──────────────────────────────────────────────────
let SC,LC,WC,Sx,Lx,Wx;
let SW=300,SH=160,LW=300,LH=160;
let audioCtx=null,analyser=null,micStream=null;
let isListening=false,sessionActive=false;
let smoothAmp=0,smoothFreq=120,T=0;
let curFreq=0,curPurity=0,curCorr=0,curMantra='—',curMatch='—';
let particles=[];
const N=28000; // doubled

// Particle settle state:
// 0 = normal (warm amber, active)
// 1 = settled (cool cyan-violet crystalline, after silence)
// 2 = scatter burst (rainbow explosion on shake/save)
let settleState=0;
let settleTimer=0;
const SETTLE_FRAMES=90; // ~3s quiet before state 1 kicks in

let appMode='measure';
let toneACtx=null,toneOsc=null,toneGainNode=null;
let toneActive=false,toneFreqVal=0;

const LIBRARY=[
  {name:'Sri Yantra',freq:136},{name:'Muladhara',freq:256},
  {name:'Svadhisthana',freq:288},{name:'Manipura',freq:528},
  {name:'Anahata',freq:594},{name:'Vishuddha',freq:672},
  {name:'Ajna',freq:852},{name:'Sahasrara',freq:963}
];

const $=id=>document.getElementById(id);
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2600);
}
function closeModal(id){$(id).classList.remove('open');}

// ── Setup ──────────────────────────────────────────────────
function setup(){
  SC=$('sandCanvas'); LC=$('laserCanvas'); WC=$('waveformCanvas');
  Sx=SC.getContext('2d'); Lx=LC.getContext('2d'); Wx=WC.getContext('2d');
  resize();
  window.addEventListener('resize',resize);
  loop();
}
function resize(){
  // Canvas gets center pane width: total minus both side panes (88px each) minus 2px borders
  const total=Math.min(window.innerWidth,480);
  const cW=Math.max(60, total-88-88-2);
  // Each canvas gets half the available height minus header/waveform/labels
  // Use offsetHeight of canvas section directly
  const topUsed=34+32+25; // top-bar + mode-toggle + waveform ~ approx
  const availH=window.innerHeight-topUsed;
  const cH=Math.max(40, Math.floor(availH/2)-16); // -16 for two panel-labels

  SW=cW; SH=cH; LW=cW; LH=cH;
  SC.width=cW; SC.height=cH;
  LC.width=cW; LC.height=cH;

  const wb=document.querySelector('.waveform-bar');
  WC.width=wb.offsetWidth||200; WC.height=22;
  initP();
}

// ── Particles ──────────────────────────────────────────────
function initP(){
  particles=[];
  for(let i=0;i<N;i++){
    particles.push({
      x:Math.random()*SW, y:Math.random()*SH,
      vx:(Math.random()-.5)*.5, vy:(Math.random()-.5)*.5,
      sz:Math.random()*2.6+0.8,  // doubled: was 1.3+0.4
      hue:Math.random()*60+15
    });
  }
}

// ── Scatter burst (shake / post-save) ─────────────────────
function scatterParticles(){
  if(settleState===2) return; // already bursting
  settleState=2;
  particles.forEach(p=>{
    p.vx=(Math.random()-.5)*9;
    p.vy=(Math.random()-.5)*9;
    p.hue=Math.random()*360;
  });
  setTimeout(()=>{ settleState=0; initP(); toast('✨ Patterns reset'); },1900);
}

// ── Particle colour by state ───────────────────────────────
function pColor(p, nv, amp, freq){
  if(settleState===2){
    // Rainbow scatter burst
    return `hsla(${p.hue},90%,65%,${0.45+nv*.45})`;
  }
  if(settleState===1){
    // Settled: cool cyan → violet crystalline
    const h=185+nv*130;
    const s=55+nv*35, l=42+nv*36;
    return `hsla(${h},${s}%,${l}%,${0.28+nv*.55})`;
  }
  // Normal warm amber/orange
  const h=p.hue+nv*55+freq/18;
  const s=55+nv*35, l=42+nv*38;
  const al=amp>0.015 ? 0.38+nv*.52 : 0.2;
  return `hsla(${h},${s}%,${l}%,${al})`;
}

// ── Physics ────────────────────────────────────────────────
function chladni(x,y,freq,t){
  const nx=(x/SW)*Math.PI*2, ny=(y/SH)*Math.PI*2;
  const m=Math.max(1,Math.round(freq/180));
  const n=Math.max(1,Math.round(freq/220));
  const z=Math.cos(m*nx)*Math.cos(n*ny)+0.28*Math.cos((m+1)*nx)*Math.sin((n+1)*ny+t*0.4);
  return{z,
    dx:-m*Math.sin(m*nx)*Math.cos(n*ny)*(Math.PI*2/SW),
    dy:-n*Math.cos(m*nx)*Math.sin(n*ny)*(Math.PI*2/SH)};
}

// ── Draw sand ──────────────────────────────────────────────
function drawSand(freq,amp,t){
  Sx.fillStyle='rgba(0,0,0,0.17)';
  Sx.fillRect(0,0,SW,SH);
  particles.forEach(p=>{
    if(amp>0.015){
      const f=chladni(p.x,p.y,freq,t);
      const pull=Math.abs(f.z)*amp*3;
      p.vx+=-f.dx*pull*2.8; p.vy+=-f.dy*pull*2.8;
    } else {
      p.vx+=(Math.random()-.5)*.22; p.vy+=(Math.random()-.5)*.22;
    }
    p.vx*=.87; p.vy*=.87;
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<1){p.x=1;p.vx*=-.4;} if(p.x>SW-1){p.x=SW-1;p.vx*=-.4;}
    if(p.y<1){p.y=1;p.vy*=-.4;} if(p.y>SH-1){p.y=SH-1;p.vy*=-.4;}
    let nv=0;
    if(amp>0.015){const f2=chladni(p.x,p.y,freq,t);nv=Math.max(0,1-Math.abs(f2.z)*2.2);}
    Sx.beginPath();
    Sx.arc(p.x,p.y, p.sz*(0.7+nv*0.75), 0, Math.PI*2);
    Sx.fillStyle=pColor(p,nv,amp,freq);
    Sx.fill();
  });
  // Track settle state
  if(sessionActive && amp<0.015){
    settleTimer++;
    if(settleTimer>SETTLE_FRAMES && settleState===0) settleState=1;
  } else if(amp>=0.015){
    settleTimer=0;
    if(settleState===1) settleState=0;
  }
}

// ── Draw laser ─────────────────────────────────────────────
function drawLaser(freq,amp,t){
  Lx.fillStyle='rgba(0,0,0,0.2)';
  Lx.fillRect(0,0,LW,LH);
  const cx=LW/2,cy=LH/2;
  const sa=Math.max(amp,0.1);
  const a=Math.max(1,Math.round(freq/200));
  const b=Math.max(1,Math.round(freq/175));
  const delta=t*.007+(freq/480)*Math.PI;
  const rx=(LW/2-8)*.9, ry=(LH/2-6)*.9;
  const steps=1800;
  function path(){
    Lx.beginPath();
    for(let i=0;i<=steps;i++){
      const tt=(i/steps)*Math.PI*2*Math.max(a,b);
      const x=cx+rx*Math.sin(a*tt+delta);
      const y=cy+ry*Math.sin(b*tt);
      i===0?Lx.moveTo(x,y):Lx.lineTo(x,y);
    }
  }
  path();Lx.strokeStyle=`rgba(0,100,220,${sa*.18})`;Lx.lineWidth=7;Lx.stroke();
  path();Lx.strokeStyle=`rgba(0,160,255,${sa*.6})`;Lx.lineWidth=2.2;Lx.stroke();
  path();Lx.strokeStyle=`rgba(200,240,255,${Math.min(1,sa*1.5)})`;Lx.lineWidth=0.85;Lx.stroke();
  if(sa>0.15){
    for(let i=0;i<6;i++){
      const tt=((i/6)+t*.0008)*Math.PI*2*Math.max(a,b);
      const x=cx+rx*Math.sin(a*tt+delta);
      const y=cy+ry*Math.sin(b*tt);
      Lx.beginPath();Lx.arc(x,y,1.8,0,Math.PI*2);
      Lx.fillStyle='rgba(255,255,255,0.85)';Lx.fill();
    }
  }
}

// ── Waveform ───────────────────────────────────────────────
function drawWave(data){
  const W=WC.width,H=WC.height;
  Wx.clearRect(0,0,W,H);
  if(!data)return;
  Wx.beginPath();
  for(let i=0;i<W;i++){
    const v=(data[Math.floor((i/W)*data.length)]/128-1)*H*.45;
    i===0?Wx.moveTo(i,H/2+v):Wx.lineTo(i,H/2+v);
  }
  Wx.strokeStyle='rgba(201,168,76,0.6)';Wx.lineWidth=1;Wx.stroke();
}

// ── Audio ──────────────────────────────────────────────────
function getPitch(data,sr){
  let mx=-1,idx=0;
  for(let i=2;i<data.length;i++){if(data[i]>mx){mx=data[i];idx=i;}}
  return(idx*sr)/(data.length*2);
}
function getMantra(f){
  if(f<200)return{sym:'OM',label:'Sri Yantra / Crown'};
  if(f<310)return{sym:'LAM',label:'Muladhara — Root'};
  if(f<420)return{sym:'VAM',label:'Svadhisthana — Sacral'};
  if(f<560)return{sym:'RAM',label:'Manipura — Solar'};
  if(f<640)return{sym:'YAM',label:'Anahata — Heart'};
  if(f<760)return{sym:'HAM',label:'Vishuddha — Throat'};
  if(f<900)return{sym:'OM',label:'Ajna — Third Eye'};
  return{sym:'AH',label:'Sahasrara — Crown'};
}
function getCorr(f,a){
  if(a<0.02)return{score:0,name:'—'};
  let best=0,name='—';
  LIBRARY.forEach(m=>{
    const s=Math.max(0,1-Math.abs(f-m.freq)/280)*a*1.6;
    if(s>best){best=s;name=m.name;}
  });
  return{score:Math.min(100,Math.round(best*100)),name};
}

// ── Main loop ──────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  T+=0.016;
  if(appMode==='chakra'&&toneActive){
    smoothAmp+=(0.65-smoothAmp)*.08;
    curPurity=Math.min(100,Math.round(smoothAmp*115));
    drawSand(toneFreqVal,smoothAmp,T);
    drawLaser(toneFreqVal,smoothAmp,T);
  } else if(appMode==='measure'&&isListening&&analyser){
    const fD=new Uint8Array(analyser.frequencyBinCount);
    const tD=new Uint8Array(analyser.fftSize);
    analyser.getByteFrequencyData(fD); analyser.getByteTimeDomainData(tD);
    let sum=0; fD.forEach(v=>sum+=v);
    const ra=(sum/(fD.length*255))*4;
    smoothAmp+=(ra-smoothAmp)*.12;
    const rf=getPitch(fD,audioCtx.sampleRate);
    if(rf>50&&rf<2000&&smoothAmp>0.018) smoothFreq+=(rf-smoothFreq)*.08;
    curFreq=Math.round(smoothFreq);
    curPurity=Math.min(100,Math.round(smoothAmp*115));
    const m=getMantra(smoothFreq); curMantra=m.sym;
    const c=getCorr(smoothFreq,smoothAmp); curCorr=c.score; curMatch=c.name;
    $('mantraDisplay').textContent=m.sym; $('mantraName').textContent=m.label;
    $('freqDisplay').textContent=curFreq+' Hz';
    $('purityFill').style.width=curPurity+'%'; $('purityScore').textContent=curPurity+'%';
    $('corrFill').style.width=curCorr+'%'; $('corrScore').textContent=curCorr+'%';
    $('matchName').textContent=curMatch;
    drawWave(tD); drawSand(smoothFreq,smoothAmp,T); drawLaser(smoothFreq,smoothAmp,T);
  } else {
    smoothAmp=Math.max(0,smoothAmp*.97);
    drawSand(110+Math.sin(T*.28)*35,0.05,T);
    drawLaser(120+Math.sin(T*.18)*55,0.18,T);
  }
}

// ── Mic ────────────────────────────────────────────────────
async function toggleMic(){isListening?stopMic():await startMic();}
async function startMic(){
  try{
    if(!navigator.mediaDevices?.getUserMedia){toast('Mic not supported');return;}
    toast('Requesting microphone...');
    micStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')await audioCtx.resume();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=4096; analyser.smoothingTimeConstant=0.8;
    audioCtx.createMediaStreamSource(micStream).connect(analyser);
    isListening=true; sessionActive=true;
    settleTimer=0; settleState=0;
    $('micBtn').classList.add('active');
    $('micIcon').textContent='🔴';
    $('micHint').textContent='Chanting...';
    toast('Listening — chant OM or any mantra');
  }catch(e){
    toast(e.name==='NotAllowedError'?'Mic blocked — allow in settings':
         e.name==='NotFoundError'?'No mic found':'Mic error: '+e.message);
  }
}
function stopMic(){
  micStream?.getTracks().forEach(t=>t.stop());
  audioCtx?.close();
  micStream=null;audioCtx=null;analyser=null;isListening=false;
  $('micBtn').classList.remove('active');
  $('micIcon').textContent='🎙️';
  $('micHint').textContent='Tap to\nstart';
}

// ── Chakra tones ───────────────────────────────────────────
function playTone(freq,name,sym){
  stopTone(false);
  try{
    toneACtx=new(window.AudioContext||window.webkitAudioContext)();
    toneOsc=toneACtx.createOscillator(); toneGainNode=toneACtx.createGain();
    toneOsc.type='sine'; toneOsc.frequency.value=freq;
    const vol=($('toneVol')?.value||28)/100;
    toneGainNode.gain.setValueAtTime(0,toneACtx.currentTime);
    toneGainNode.gain.linearRampToValueAtTime(vol,toneACtx.currentTime+0.12);
    toneOsc.connect(toneGainNode); toneGainNode.connect(toneACtx.destination);
    toneOsc.start();
    toneFreqVal=freq; toneActive=true; sessionActive=true;
    settleTimer=0; settleState=0;
    curFreq=freq; curMantra=sym; curMatch=name;
    $('mantraDisplay').textContent=sym; $('mantraName').textContent=name;
    $('freqDisplay').textContent=freq+' Hz';
    $('corrFill').style.width='100%'; $('corrScore').textContent='100%'; $('matchName').textContent=name;
    document.querySelectorAll('.cBtn').forEach(b=>b.classList.toggle('playing',parseInt(b.dataset.freq)===freq));
    toast('♪ Playing '+freq+' Hz — '+name);
  }catch(e){toast('Audio error: '+e.message);}
}
function stopTone(updateUI=true){
  if(toneGainNode&&toneACtx){
    toneGainNode.gain.linearRampToValueAtTime(0,toneACtx.currentTime+0.1);
    setTimeout(()=>toneACtx?.close(),150);
  }
  toneOsc=null;toneGainNode=null;toneACtx=null;toneActive=false;toneFreqVal=0;
  if(updateUI){document.querySelectorAll('.cBtn').forEach(b=>b.classList.remove('playing'));smoothAmp=0;}
}
function updateToneVol(){
  if(toneGainNode&&toneACtx)
    toneGainNode.gain.linearRampToValueAtTime(($('toneVol').value||28)/100,toneACtx.currentTime+0.05);
}

// ── Mode switch ────────────────────────────────────────────
function setMode(mode){
  appMode=mode;
  const isMeasure=(mode==='measure');
  $('modeMeasure').classList.toggle('active',isMeasure);
  $('modeChakra').classList.toggle('active',!isMeasure);
  $('chakraPanel').classList.toggle('visible',!isMeasure);
  $('leftPane').style.display=isMeasure?'':'none';
  if(isMeasure)stopTone(); else stopMic();
  toast(isMeasure?'Measure mode — chant into mic':'Chakra Tone mode — tap a chakra');
}

// ── Save / Load ────────────────────────────────────────────
function openSave(){
  if(!sessionActive){toast('Start a session first');return;}
  $('sessionName').value=curMantra!=='—'?curMantra+' session':'';
  $('sessionNotes').value='';
  $('saveModal').classList.add('open');
}
function doSave(){
  const s={
    id:Date.now(),name:$('sessionName').value||'Untitled',notes:$('sessionNotes').value,
    mantra:curMantra,freq:curFreq,purity:curPurity,corr:curCorr,match:curMatch,
    sandImg:SC.toDataURL('image/jpeg',.75),laserImg:LC.toDataURL('image/jpeg',.75),
    ts:new Date().toLocaleString()
  };
  const all=loadSessions(); all.unshift(s);
  try{localStorage.setItem('cm_sess',JSON.stringify(all.slice(0,50)));}
  catch{toast('Storage full');return;}
  $('saveModal').classList.remove('open');
  toast('Session saved ✦');
  setTimeout(scatterParticles,400); // celebration burst
}
function loadSessions(){try{return JSON.parse(localStorage.getItem('cm_sess')||'[]');}catch{return[];}}
function openSessions(){
  const list=loadSessions();
  $('sessionsList').innerHTML=list.length===0
    ?'<div class="no-sessions">No sessions yet.<br>Start chanting to create your first mandala.</div>'
    :list.map(s=>`<div class="session-card">
        <div class="session-top"><div class="session-mantra">${s.mantra} — ${s.name}</div><div class="session-date">${s.ts}</div></div>
        <div class="session-meta"><span>Freq: <span>${s.freq} Hz</span></span><span>Purity: <span>${s.purity}%</span></span><span>Match: <span>${s.match}</span></span></div>
        ${s.notes?`<div style="font-size:.62rem;color:rgba(255,255,255,.35);margin-top:5px;font-style:italic">"${s.notes}"</div>`:''}
        <div class="session-thumbs"><img src="${s.sandImg}"/><img src="${s.laserImg}"/></div>
      </div>`).join('');
  $('sessionsModal').classList.add('open');
}

// ── New session ────────────────────────────────────────────
function doNew(){
  stopMic(); sessionActive=false;
  smoothAmp=0;smoothFreq=120;T=0;
  curFreq=0;curPurity=0;curCorr=0;curMantra='—';curMatch='—';
  $('mantraDisplay').textContent='—'; $('mantraName').textContent='Waiting...';
  $('freqDisplay').textContent='— Hz'; $('purityFill').style.width='0%'; $('purityScore').textContent='0%';
  $('corrFill').style.width='0%'; $('corrScore').textContent='0%'; $('matchName').textContent='—';
  settleState=0; settleTimer=0;
  initP(); toast('Ready for new session');
}

// ── Shake detection ────────────────────────────────────────
let lastShake=0, ax0=0,ay0=0,az0=0;
function initShake(){
  if(!window.DeviceMotionEvent)return;
  if(typeof DeviceMotionEvent.requestPermission==='function'){
    // iOS 13+ — request on first tap
    document.addEventListener('click',()=>{
      DeviceMotionEvent.requestPermission()
        .then(r=>{if(r==='granted')window.addEventListener('devicemotion',onMotion);})
        .catch(()=>{});
    },{once:true});
  } else {
    window.addEventListener('devicemotion',onMotion);
  }
}
function onMotion(e){
  const a=e.accelerationIncludingGravity; if(!a)return;
  const dx=Math.abs(a.x-ax0),dy=Math.abs(a.y-ay0),dz=Math.abs(a.z-az0);
  ax0=a.x; ay0=a.y; az0=a.z;
  const total=dx+dy+dz;
  const now=Date.now();
  if(total>28&&now-lastShake>1200){
    lastShake=now;
    toast('📳 Shake! Resetting patterns...');
    const cp=$('centerPane');
    cp.classList.add('shake-flash');
    setTimeout(()=>cp.classList.remove('shake-flash'),700);
    scatterParticles();
  }
}

  $('confirmSave').addEventListener('click',doSave);

  $('closeSessions').addEventListener('click',()=>closeModal('sessionsModal'));
  $('modeMeasure').addEventListener('click',()=>setMode('measure'));

  document.querySelectorAll('.cBtn').forEach(btn=>{
    btn.addEventListener('click',()=>{

      btn.classList.contains('playing')?stopTone():playTone(f,btn.dataset.name,btn.dataset.sym);
    });

  document.querySelectorAll('.modal-overlay').forEach(el=>
    el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open');}));
  initShake();
  // Register service worker for PWA
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js')
      .then(()=>console.log('CymaticaMandala SW registered'))
      .catch(e=>console.warn('SW:',e));
  }
});
