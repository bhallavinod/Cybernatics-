<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CymaticaMandala</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Raleway:wght@300;400;500&display=swap');
:root{--gold:#c9a84c;--gl:#f0d080;--deep:#050810;--border:rgba(201,168,76,0.3);--blue:#00aaff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--deep);color:#fff;font-family:'Raleway',sans-serif;min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none}
.app{max-width:480px;margin:0 auto;padding-bottom:120px}
header{text-align:center;padding:10px 16px 7px;border-bottom:1px solid var(--border)}
.app-title{font-family:'Cinzel',serif;font-size:1.35rem;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--gl),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.08em}
.app-subtitle{font-size:.58rem;color:rgba(201,168,76,.55);letter-spacing:.25em;text-transform:uppercase}
.status-bar{display:flex;justify-content:space-between;align-items:center;padding:7px 14px;border-bottom:1px solid var(--border);background:rgba(201,168,76,.04)}
.mantra-display{font-family:'Cinzel',serif;font-size:1.1rem;color:var(--gl)}
.mantra-name{font-size:.58rem;color:rgba(255,255,255,.3);margin-top:1px}
.freq-display{text-align:center;font-size:.7rem;color:rgba(255,255,255,.5)}
.freq-display span{display:block;font-size:1rem;color:var(--blue);font-weight:500}
.purity-wrap{text-align:right}
.purity-label{font-size:.58rem;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.1em}
.purity-bar{width:68px;height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:3px}
.purity-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gl));border-radius:2px;transition:width .3s}
.purity-score{font-size:.65rem;color:var(--gl);text-align:right;margin-top:2px}
.waveform-bar{height:28px;margin:5px 6px 0;background:rgba(0,0,0,.4);border-radius:5px;border:1px solid var(--border);overflow:hidden}
#waveformCanvas{width:100%;height:100%;display:block}
.panel-label{font-size:.58rem;text-transform:uppercase;letter-spacing:.2em;text-align:center;padding:3px 0;border-radius:3px;margin:7px 6px 3px}
.sand-label{color:#ff9944;background:rgba(255,153,68,.07);border:1px solid rgba(255,153,68,.2)}
.laser-label{color:var(--blue);background:rgba(0,170,255,.07);border:1px solid rgba(0,170,255,.2)}
#sandCanvas,#laserCanvas{display:block;margin:0 6px;border-radius:8px;border:1px solid var(--border);background:#000}
.mid-row{display:flex;align-items:center;gap:14px;padding:8px 12px}
.mic-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.mic-btn{width:62px;height:62px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle,rgba(201,168,76,.14) 0%,rgba(201,168,76,.02) 70%);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;-webkit-tap-highlight-color:transparent;transition:all .2s}
.mic-btn.active{border-color:#ff4444;background:radial-gradient(circle,rgba(255,68,68,.2) 0%,rgba(255,68,68,.04) 70%);animation:pulse-mic 1.4s ease-in-out infinite}
@keyframes pulse-mic{0%,100%{box-shadow:0 0 16px rgba(255,68,68,.3)}50%{box-shadow:0 0 30px rgba(255,68,68,.6)}}
.mic-ring{position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(201,168,76,.2);animation:ring-out 2s ease-out infinite;opacity:0}
.mic-btn.active .mic-ring{border-color:rgba(255,68,68,.3);animation:ring-out 1.2s ease-out infinite}
@keyframes ring-out{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.45);opacity:0}}
.mic-icon{font-size:26px}
.mic-hint{font-size:.6rem;color:rgba(255,255,255,.3);text-align:center;margin-top:4px}
.corr-col{flex:1;display:flex;flex-direction:column;gap:5px}
.corr-top{display:flex;align-items:center;gap:8px}
.corr-label{font-size:.58rem;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.35);white-space:nowrap}
.corr-score{font-size:.95rem;font-weight:600;color:var(--gl);min-width:40px;text-align:right}
.match-name{font-size:.62rem;color:rgba(201,168,76,.75);white-space:nowrap}
.corr-bar{width:100%;height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.corr-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--gold));border-radius:3px;transition:width .5s}
.actions{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;padding:8px 8px 18px;gap:6px;background:linear-gradient(to top,rgba(5,8,16,.98) 65%,transparent);z-index:50}
.btn{flex:1;padding:11px 4px;border-radius:10px;border:1px solid;font-family:'Raleway',sans-serif;font-size:.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;-webkit-tap-highlight-color:transparent;transition:opacity .15s}
.btn:active{opacity:.6}
.btn-icon{font-size:17px}
.btn-save{background:rgba(201,168,76,.08);border-color:rgba(201,168,76,.35);color:var(--gl)}
.btn-view{background:rgba(0,170,255,.07);border-color:rgba(0,170,255,.28);color:var(--blue)}
.btn-pdf{background:rgba(80,200,80,.07);border-color:rgba(80,200,80,.28);color:#88dd88}
.btn-new{background:rgba(255,90,90,.07);border-color:rgba(255,90,90,.28);color:#ff9999}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;padding:20px;overflow-y:auto;align-items:flex-start;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:rgba(10,14,30,.97);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:440px;margin-top:20px}
.modal-title{font-family:'Cinzel',serif;font-size:1rem;color:var(--gl);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.close-btn{background:none;border:none;color:rgba(255,255,255,.4);font-size:1.2rem;cursor:pointer;padding:4px 8px}
.form-label{font-size:.68rem;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}
.form-input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(201,168,76,.3);border-radius:8px;padding:10px 12px;color:#fff;font-family:'Raleway',sans-serif;font-size:.85rem;outline:none;margin-bottom:12px}
.form-input:focus{border-color:var(--gold)}
.btn-confirm{width:100%;background:linear-gradient(135deg,rgba(201,168,76,.25),rgba(201,168,76,.1));border:1px solid var(--gold);border-radius:8px;padding:12px;color:var(--gl);font-family:'Cinzel',serif;font-size:.85rem;letter-spacing:.1em;cursor:pointer}
.sessions-list{display:flex;flex-direction:column;gap:10px;max-height:65vh;overflow-y:auto}
.session-card{background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.18);border-radius:10px;padding:12px}
.session-top{display:flex;justify-content:space-between;margin-bottom:5px}
.session-mantra{font-family:'Cinzel',serif;font-size:.95rem;color:var(--gl)}
.session-date{font-size:.58rem;color:rgba(255,255,255,.3)}
.session-meta{font-size:.62rem;color:rgba(255,255,255,.45);display:flex;gap:10px}
.session-meta span{color:var(--blue)}
.session-thumbs{display:flex;gap:6px;margin-top:8px}
.session-thumbs img{flex:1;border-radius:6px;border:1px solid rgba(255,255,255,.1);max-height:90px;object-fit:cover;width:0}
.no-sessions{text-align:center;padding:40px 20px;color:rgba(255,255,255,.28);font-size:.85rem;line-height:2}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(8,12,28,.96);border:1px solid var(--gold);border-radius:20px;padding:8px 20px;font-size:.75rem;color:var(--gl);opacity:0;transition:all .28s;z-index:200;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="app-title">CymaticaMandala</div>
    <div class="app-subtitle">Sound · Geometry · Healing</div>
  </header>

  <div class="status-bar">
    <div>
      <div class="mantra-display" id="mantraDisplay">—</div>
      <div class="mantra-name" id="mantraName">Waiting...</div>
    </div>
    <div class="freq-display"><span id="freqDisplay">— Hz</span>Frequency</div>
    <div class="purity-wrap">
      <div class="purity-label">Purity</div>
      <div class="purity-bar"><div class="purity-fill" id="purityFill"></div></div>
      <div class="purity-score" id="purityScore">0%</div>
    </div>
  </div>

  <div class="waveform-bar"><canvas id="waveformCanvas"></canvas></div>

  <div class="panel-label sand-label">Sand Cymatics</div>
  <canvas id="sandCanvas"></canvas>

  <div class="mid-row">
    <div class="mic-col">
      <div class="mic-btn" id="micBtn">
        <div class="mic-ring"></div>
        <span class="mic-icon" id="micIcon">🎙️</span>
      </div>
      <div class="mic-hint" id="micHint">Tap to start</div>
    </div>
    <div class="corr-col">
      <div class="corr-top">
        <span class="corr-label">Match</span>
        <span class="corr-score" id="corrScore">0%</span>
        <span class="match-name" id="matchName">—</span>
      </div>
      <div class="corr-bar"><div class="corr-fill" id="corrFill"></div></div>
    </div>
  </div>

  <div class="panel-label laser-label">Laser Pattern</div>
  <canvas id="laserCanvas"></canvas>

  <div class="actions">
    <button class="btn btn-save" id="btnSave"><span class="btn-icon">💾</span>Save</button>
    <button class="btn btn-view" id="btnView"><span class="btn-icon">📂</span>Saved</button>
    <button class="btn btn-pdf"  id="btnPdf"><span class="btn-icon">📄</span>PDF</button>
    <button class="btn btn-new"  id="btnNew"><span class="btn-icon">✨</span>New</button>
  </div>
</div>

<div class="modal-overlay" id="saveModal">
  <div class="modal">
    <div class="modal-title">Save Session<button class="close-btn" id="closeSave">✕</button></div>
    <div class="form-label">Session Name</div>
    <input class="form-input" id="sessionName" placeholder="e.g. Morning OM chant"/>
    <div class="form-label">Notes (optional)</div>
    <input class="form-input" id="sessionNotes" placeholder="How did you feel?"/>
    <button class="btn-confirm" id="confirmSave">✦ Save to Library</button>
  </div>
</div>

<div class="modal-overlay" id="sessionsModal">
  <div class="modal">
    <div class="modal-title">Saved Sessions<button class="close-btn" id="closeSessions">✕</button></div>
    <div class="sessions-list" id="sessionsList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

// ── State ─────────────────────────────────────────────────
let SC, LC, WC, Sx, Lx, Wx;   // canvases + contexts
let SW=300,SH=160,LW=300,LH=160; // sand/laser dimensions

let audioCtx=null,analyser=null,micStream=null;
let isListening=false,sessionActive=false;
let smoothAmp=0,smoothFreq=120,T=0;
let curFreq=0,curPurity=0,curCorr=0,curMantra='—',curMatch='—';
let particles=[];
const N=3500;

const LIBRARY=[
  {name:'Sri Yantra',freq:136},{name:'Muladhara',freq:256},
  {name:'Svadhisthana',freq:288},{name:'Manipura',freq:528},
  {name:'Anahata',freq:594},{name:'Vishuddha',freq:672},
  {name:'Ajna',freq:852},{name:'Sahasrara',freq:963}
];

// ── Setup ─────────────────────────────────────────────────
function setup(){
  SC=document.getElementById('sandCanvas');
  LC=document.getElementById('laserCanvas');
  WC=document.getElementById('waveformCanvas');
  Sx=SC.getContext('2d'); Lx=LC.getContext('2d'); Wx=WC.getContext('2d');
  resize();
  window.addEventListener('resize',resize);
  loop();
}

function resize(){
  const W=Math.min(window.innerWidth,480)-12;
  const H=Math.round(W*0.5);
  SW=W; SH=H; LW=W; LH=H;
  SC.width=W; SC.height=H; SC.style.width=W+'px'; SC.style.height=H+'px';
  LC.width=W; LC.height=H; LC.style.width=W+'px'; LC.style.height=H+'px';
  const wb=document.querySelector('.waveform-bar');
  WC.width=wb.offsetWidth||300; WC.height=28;
  initP();
}

// ── Particles ─────────────────────────────────────────────
function initP(){
  particles=[];
  for(let i=0;i<N;i++){
    const a=Math.random()*Math.PI*2;
    const r=Math.sqrt(Math.random())*Math.min(SW,SH)*0.48;
    particles.push({
      x:SW/2+Math.cos(a)*r, y:SH/2+Math.sin(a)*r,
      vx:0,vy:0,
      sz:Math.random()*1.3+0.4,
      hue:Math.random()*60+15
    });
  }
}

// ── Physics ───────────────────────────────────────────────
function chladni(x,y,freq,t){
  const nx=(x/SW)*Math.PI*2, ny=(y/SH)*Math.PI*2;
  const m=Math.max(1,Math.round(freq/180));
  const n=Math.max(1,Math.round(freq/220));
  const z=Math.cos(m*nx)*Math.cos(n*ny)+0.28*Math.cos((m+1)*nx)*Math.sin((n+1)*ny+t*0.4);
  return{
    z,
    dx:-m*Math.sin(m*nx)*Math.cos(n*ny)*(Math.PI*2/SW),
    dy:-n*Math.cos(m*nx)*Math.sin(n*ny)*(Math.PI*2/SH)
  };
}

// ── Draw sand ─────────────────────────────────────────────
function drawSand(freq,amp,t){
  Sx.fillStyle='rgba(0,0,0,0.17)';
  Sx.fillRect(0,0,SW,SH);

  particles.forEach(p=>{
    if(amp>0.015){
      const f=chladni(p.x,p.y,freq,t);
      const pull=Math.abs(f.z)*amp*3;
      p.vx+=-f.dx*pull*2.8;
      p.vy+=-f.dy*pull*2.8;
    } else {
      p.vx+=(Math.random()-.5)*.22;
      p.vy+=(Math.random()-.5)*.22;
    }
    p.vx*=.87; p.vy*=.87;
    p.x+=p.vx; p.y+=p.vy;
    // rectangular bounce
    if(p.x<1){p.x=1;p.vx*=-.4;}
    if(p.x>SW-1){p.x=SW-1;p.vx*=-.4;}
    if(p.y<1){p.y=1;p.vy*=-.4;}
    if(p.y>SH-1){p.y=SH-1;p.vy*=-.4;}

    let nv=0;
    if(amp>0.015){const f2=chladni(p.x,p.y,freq,t);nv=Math.max(0,1-Math.abs(f2.z)*2.2);}
    const h=p.hue+nv*55+freq/18;
    const s=55+nv*35, l=42+nv*38;
    const al=amp>0.015?0.38+nv*.52:0.2;
    Sx.beginPath();
    Sx.arc(p.x,p.y,p.sz*(0.7+nv*0.75),0,Math.PI*2);
    Sx.fillStyle=`hsla(${h},${s}%,${l}%,${al})`;
    Sx.fill();
  });
}

// ── Draw laser ────────────────────────────────────────────
function drawLaser(freq,amp,t){
  Lx.fillStyle='rgba(0,0,0,0.2)';
  Lx.fillRect(0,0,LW,LH);
  const cx=LW/2,cy=LH/2;
  const sa=Math.max(amp,0.1);
  const a=Math.max(1,Math.round(freq/200));
  const b=Math.max(1,Math.round(freq/175));
  const delta=t*.007+(freq/480)*Math.PI;
  const rx=(LW/2-8)*.9, ry=(LH/2-6)*.9;
  const steps=1800;

  function path(){
    Lx.beginPath();
    for(let i=0;i<=steps;i++){
      const tt=(i/steps)*Math.PI*2*Math.max(a,b);
      const x=cx+rx*Math.sin(a*tt+delta);
      const y=cy+ry*Math.sin(b*tt);
      i===0?Lx.moveTo(x,y):Lx.lineTo(x,y);
    }
  }

  path();Lx.strokeStyle=`rgba(0,100,220,${sa*.18})`;Lx.lineWidth=7;Lx.stroke();
  path();Lx.strokeStyle=`rgba(0,160,255,${sa*.6})`;Lx.lineWidth=2.2;Lx.stroke();
  path();Lx.strokeStyle=`rgba(200,240,255,${Math.min(1,sa*1.5)})`;Lx.lineWidth=0.85;Lx.stroke();

  if(sa>0.15){
    for(let i=0;i<6;i++){
      const tt=((i/6)+t*.0008)*Math.PI*2*Math.max(a,b);
      const x=cx+rx*Math.sin(a*tt+delta);
      const y=cy+ry*Math.sin(b*tt);
      Lx.beginPath();Lx.arc(x,y,1.8,0,Math.PI*2);
      Lx.fillStyle='rgba(255,255,255,0.85)';Lx.fill();
    }
  }
}

// ── Waveform ──────────────────────────────────────────────
function drawWave(data){
  const W=WC.width,H=WC.height;
  Wx.clearRect(0,0,W,H);
  if(!data)return;
  Wx.beginPath();
  for(let i=0;i<W;i++){
    const v=(data[Math.floor((i/W)*data.length)]/128-1)*H*.45;
    i===0?Wx.moveTo(i,H/2+v):Wx.lineTo(i,H/2+v);
  }
  Wx.strokeStyle='rgba(201,168,76,0.6)';Wx.lineWidth=1;Wx.stroke();
}

// ── Audio analysis ────────────────────────────────────────
function getPitch(data,sr){
  let mx=-1,idx=0;
  for(let i=2;i<data.length;i++){if(data[i]>mx){mx=data[i];idx=i;}}
  return(idx*sr)/(data.length*2);
}

function getMantra(f){
  if(f<200)return{sym:'OM',label:'Sri Yantra / Crown'};
  if(f<310)return{sym:'LAM',label:'Muladhara — Root'};
  if(f<420)return{sym:'VAM',label:'Svadhisthana — Sacral'};
  if(f<560)return{sym:'RAM',label:'Manipura — Solar'};
  if(f<640)return{sym:'YAM',label:'Anahata — Heart'};
  if(f<760)return{sym:'HAM',label:'Vishuddha — Throat'};
  if(f<900)return{sym:'OM',label:'Ajna — Third Eye'};
  return{sym:'AH',label:'Sahasrara — Crown'};
}

function getCorr(f,a){
  if(a<0.02)return{score:0,name:'—'};
  let best=0,name='—';
  LIBRARY.forEach(m=>{
    const s=Math.max(0,1-Math.abs(f-m.freq)/280)*a*1.6;
    if(s>best){best=s;name=m.name;}
  });
  return{score:Math.min(100,Math.round(best*100)),name};
}

// ── Main loop ─────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  T+=0.016;

  if(isListening&&analyser){
    const fD=new Uint8Array(analyser.frequencyBinCount);
    const tD=new Uint8Array(analyser.fftSize);
    analyser.getByteFrequencyData(fD);
    analyser.getByteTimeDomainData(tD);

    let sum=0; fD.forEach(v=>sum+=v);
    const ra=(sum/(fD.length*255))*4;
    smoothAmp+=(ra-smoothAmp)*.12;

    const rf=getPitch(fD,audioCtx.sampleRate);
    if(rf>50&&rf<2000&&smoothAmp>0.018) smoothFreq+=(rf-smoothFreq)*.08;

    curFreq=Math.round(smoothFreq);
    curPurity=Math.min(100,Math.round(smoothAmp*115));
    const m=getMantra(smoothFreq);
    curMantra=m.sym;
    const c=getCorr(smoothFreq,smoothAmp);
    curCorr=c.score; curMatch=c.name;

    $('mantraDisplay').textContent=m.sym;
    $('mantraName').textContent=m.label;
    $('freqDisplay').textContent=curFreq+' Hz';
    $('purityFill').style.width=curPurity+'%';
    $('purityScore').textContent=curPurity+'%';
    $('corrFill').style.width=curCorr+'%';
    $('corrScore').textContent=curCorr+'%';
    $('matchName').textContent=curMatch;

    drawWave(tD);
    drawSand(smoothFreq,smoothAmp,T);
    drawLaser(smoothFreq,smoothAmp,T);
  } else {
    smoothAmp=Math.max(0,smoothAmp*.97);
    drawSand(110+Math.sin(T*.28)*35,0.05,T);
    drawLaser(120+Math.sin(T*.18)*55,0.18,T);
  }
}

// ── Mic ───────────────────────────────────────────────────
async function toggleMic(){isListening?stopMic():await startMic();}

async function startMic(){
  try{
    if(!navigator.mediaDevices?.getUserMedia){toast('Browser does not support mic');return;}
    toast('Requesting microphone...');
    micStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')await audioCtx.resume();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=4096; analyser.smoothingTimeConstant=0.8;
    audioCtx.createMediaStreamSource(micStream).connect(analyser);
    isListening=true; sessionActive=true;
    $('micBtn').classList.add('active');
    $('micIcon').textContent='🔴';
    $('micHint').textContent='Chant your mantra...';
    toast('Listening — chant OM or any mantra');
  }catch(e){
    toast(e.name==='NotAllowedError'?'Mic blocked — allow in browser settings':
         e.name==='NotFoundError'?'No microphone found':'Mic error: '+e.message);
  }
}

function stopMic(){
  micStream?.getTracks().forEach(t=>t.stop());
  audioCtx?.close();
  micStream=null;audioCtx=null;analyser=null;isListening=false;
  $('micBtn').classList.remove('active');
  $('micIcon').textContent='🎙️';
  $('micHint').textContent='Tap to start';
}

// ── Save / Load ───────────────────────────────────────────
function openSave(){
  if(!sessionActive){toast('Start a session first');return;}
  $('sessionName').value=curMantra!=='—'?curMantra+' session':'';
  $('sessionNotes').value='';
  $('saveModal').classList.add('open');
}

function doSave(){
  const s={
    id:Date.now(),
    name:$('sessionName').value||'Untitled',
    notes:$('sessionNotes').value,
    mantra:curMantra,freq:curFreq,purity:curPurity,corr:curCorr,match:curMatch,
    sandImg:SC.toDataURL('image/jpeg',.75),
    laserImg:LC.toDataURL('image/jpeg',.75),
    ts:new Date().toLocaleString()
  };
  const all=loadSessions();all.unshift(s);
  try{localStorage.setItem('cm_sess',JSON.stringify(all.slice(0,50)));}
  catch{toast('Storage full');return;}
  $('saveModal').classList.remove('open');
  toast('Session saved');
}

function loadSessions(){try{return JSON.parse(localStorage.getItem('cm_sess')||'[]');}catch{return[];}}

function openSessions(){
  const list=loadSessions();
  $('sessionsList').innerHTML=list.length===0
    ?'<div class="no-sessions">No sessions yet.<br>Start chanting to create your first mandala.</div>'
    :list.map(s=>`<div class="session-card">
        <div class="session-top"><div class="session-mantra">${s.mantra} — ${s.name}</div><div class="session-date">${s.ts}</div></div>
        <div class="session-meta"><span>Freq: <span>${s.freq} Hz</span></span><span>Purity: <span>${s.purity}%</span></span><span>Match: <span>${s.match}</span></span></div>
        ${s.notes?`<div style="font-size:.62rem;color:rgba(255,255,255,.35);margin-top:5px;font-style:italic">"${s.notes}"</div>`:''}
        <div class="session-thumbs"><img src="${s.sandImg}"/><img src="${s.laserImg}"/></div>
      </div>`).join('');
  $('sessionsModal').classList.add('open');
}

// ── PDF ───────────────────────────────────────────────────

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>CymaticaMandala</title>

.meta{display:flex;justify-content:space-around;background:rgba(201,168,76,.06);border-radius:8px;padding:14px;margin-bottom:20px}
.mv{font-size:1.4rem;color:#f0d080;text-align:center}.ml{font-size:.6rem;color:rgba(255,255,255,.35);text-transform:uppercase;text-align:center;margin-top:3px}

@media print{body{background:#050810!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body>
<h1>CymaticaMandala</h1><div class="sub">Sound · Geometry · Healing</div>
<div class="meta">
<div><div class="mv">${curMantra}</div><div class="ml">Mantra</div></div>
<div><div class="mv">${curFreq} Hz</div><div class="ml">Frequency</div></div>
<div><div class="mv">${curPurity}%</div><div class="ml">Purity</div></div>
<div><div class="mv">${curCorr}%</div><div class="ml">Match: ${curMatch}</div></div></div>
<div class="imgs">
<div><img src="${SC.toDataURL('image/jpeg',.9)}"/><div class="cap">Sand Cymatics</div></div>

</div>

// ── Reset ─────────────────────────────────────────────────
function doNew(){
  stopMic();sessionActive=false;
  smoothAmp=0;smoothFreq=120;T=0;
  curFreq=0;curPurity=0;curCorr=0;curMantra='—';curMatch='—';
  $('mantraDisplay').textContent='—';$('mantraName').textContent='Waiting...';
  $('freqDisplay').textContent='— Hz';$('purityFill').style.width='0%';
  $('purityScore').textContent='0%';$('corrFill').style.width='0%';
  $('corrScore').textContent='0%';$('matchName').textContent='—';
  initP();toast('Ready for new session');
}

// ── Utils ─────────────────────────────────────────────────
const $=id=>document.getElementById(id);
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2600);
}
function closeModal(id){$(id).classList.remove('open');}

// ── Boot ──────────────────────────────────────────────────
window.addEventListener('load',()=>{
  setup();
  $('micBtn').addEventListener('click',toggleMic);
  $('btnSave').addEventListener('click',openSave);
  $('btnView').addEventListener('click',openSessions);
  $('btnPdf').addEventListener('click',doPDF);
  $('btnNew').addEventListener('click',doNew);
  $('confirmSave').addEventListener('click',doSave);
  $('closeSave').addEventListener('click',()=>closeModal('saveModal'));
  $('closeSessions').addEventListener('click',()=>closeModal('sessionsModal'));
  document.querySelectorAll('.modal-overlay').forEach(el=>
    el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open');})
  );
});
</script>
</body>
</html>
